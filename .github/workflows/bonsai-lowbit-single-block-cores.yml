name: bonsai-lowbit-single-block-cores

on:
  workflow_dispatch:
    inputs:
      run_reference_probes:
        description: "Run unpacked reference-model probes. Set true only when HF rate limits are acceptable."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub safetensors onnx onnxscript onnxruntime

      - name: Write skipped reference probe reports
        if: ${{ inputs.run_reference_probes != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for dirname, target in {
              'bonsai-full-transformer-inventory': 'full transformer static inventory',
              'bonsai-passthrough-value-equivalence': 'passthrough tensor value equivalence',
              'bonsai-passthrough-operation-equivalence': 'passthrough operation equivalence',
          }.items():
              p = Path('reports') / dirname
              p.mkdir(parents=True, exist_ok=True)
              (p / 'report.json').write_text(json.dumps({
                  'target': target,
                  'skipped': True,
                  'skip_reason': 'reference_probes_disabled_by_default_to_avoid_hf_429',
                  'uses_lowbit_source': True,
                  'writes_expanded_checkpoint': False,
              }, indent=2) + '\n')
          PY

      - name: Probe reference inventory
        if: ${{ inputs.run_reference_probes == 'true' }}
        run: python scripts/probe_bonsai_full_transformer_inventory.py

      - name: Probe reference passthrough values
        if: ${{ inputs.run_reference_probes == 'true' }}
        run: python scripts/probe_bonsai_passthrough_value_equivalence.py

      - name: Probe reference passthrough operations
        if: ${{ inputs.run_reference_probes == 'true' }}
        run: python scripts/probe_bonsai_passthrough_operation_equivalence.py

      - name: Probe all low-bit single block cores
        env:
          BONSAI_SINGLE_BLOCK_CORE_LIMIT: "0"
        run: python scripts/probe_bonsai_lowbit_single_block_cores.py

      - name: Probe low-bit quantized inventory
        run: python scripts/probe_bonsai_lowbit_quantized_inventory.py

      - name: Probe double block inventory
        run: python scripts/probe_bonsai_double_block_inventory.py

      - name: Probe low-bit double block core
        run: python scripts/probe_bonsai_lowbit_double_block_core.py

      - name: Probe all low-bit double block cores
        env:
          BONSAI_DOUBLE_BLOCK_CORE_LIMIT: "0"
        run: python scripts/probe_bonsai_lowbit_double_block_cores.py

      - name: Export and run all low-bit double block cores ONNX
        timeout-minutes: 45
        env:
          BONSAI_DOUBLE_BLOCK_CORE_ONNX_LIMIT: "0"
        run: python scripts/export_bonsai_lowbit_double_block_cores_onnx.py

      - name: Probe low-bit transformer core stack
        run: python scripts/probe_bonsai_lowbit_transformer_core_stack.py

      - name: Probe low-bit modulated gated block cores
        env:
          BONSAI_MODULATED_DOUBLE_BLOCKS: "5"
          BONSAI_MODULATED_SINGLE_BLOCKS: "20"
          BONSAI_MODULATED_INPUT_SCALE: "0.01"
          BONSAI_MODULATED_TEMB_SCALE: "0.01"
        run: python scripts/probe_bonsai_lowbit_modulated_block_cores.py

      - name: Probe low-bit RoPE smoke
        run: python scripts/probe_bonsai_lowbit_rope_smoke.py

      - name: Probe wrapper smoke
        run: python scripts/probe_bonsai_wrapper_smoke.py

      - name: Probe latent step smoke
        run: python scripts/probe_bonsai_latent_step_smoke.py

      - name: Probe latent preview PNG smoke
        run: python scripts/probe_bonsai_latent_preview_png.py

      - name: Probe simple decoder PNG smoke
        run: python scripts/probe_bonsai_simple_decoder_png.py

      - name: Probe staged generation smoke
        timeout-minutes: 45
        run: python scripts/probe_bonsai_staged_generation_smoke.py

      - name: Export sampled low-bit transformer core stack ONNX
        timeout-minutes: 20
        env:
          BONSAI_CORE_STACK_ONNX_DOUBLE_BLOCKS: "0"
          BONSAI_CORE_STACK_ONNX_SINGLE_BLOCKS: "1"
          BONSAI_CORE_STACK_INPUT_SCALE: "0.01"
          BONSAI_CORE_STACK_RESIDUAL_SCALE: "0.001"
        run: python scripts/export_bonsai_lowbit_transformer_core_stack_onnx.py

      - name: Show report summaries
        if: always()
        run: |
          find reports -name report.json -print | sort | while read -r f; do
            echo "--- $f"
            python -c "import json,sys; r=json.load(open(sys.argv[1])); keys=['target','skipped','skip_reason','uses_lowbit_source','writes_expanded_checkpoint','step_count','all_steps_finite','all_stages_passed','allclose_rtol_1e_4_atol_1e_5','all_finite','has_png_artifact','png_size_bytes','not_vae_decode','max_abs_error','failure']; print(json.dumps({k:r.get(k) for k in keys if k in r}, indent=2))" "$f"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-lowbit-single-block-cores-report
          path: |
            reports/**/report.json
            reports/**/*.png
          retention-days: 7
