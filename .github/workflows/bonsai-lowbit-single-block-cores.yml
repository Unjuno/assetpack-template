name: bonsai-lowbit-single-block-cores

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub safetensors

      - name: Probe all low-bit single block cores
        env:
          BONSAI_SINGLE_BLOCK_CORE_LIMIT: "0"
        run: |
          python scripts/probe_bonsai_lowbit_single_block_cores.py

      - name: Probe low-bit quantized inventory
        run: |
          python scripts/probe_bonsai_lowbit_quantized_inventory.py

      - name: Probe double block inventory
        run: |
          python scripts/probe_bonsai_double_block_inventory.py

      - name: Probe low-bit double block core
        run: |
          python scripts/probe_bonsai_lowbit_double_block_core.py

      - name: Show block cores summary
        if: always()
        run: |
          if [ -f reports/bonsai-lowbit-single-block-cores/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-lowbit-single-block-cores/report.json').read_text()); print(json.dumps({'uses_lowbit_source': r.get('uses_lowbit_source'), 'writes_expanded_checkpoint': r.get('writes_expanded_checkpoint'), 'not_full_diffusers_block': r.get('not_full_diffusers_block'), 'block_core_count': r.get('block_core_count'), 'failure_count': r.get('failure_count'), 'allclose_all': r.get('allclose_all'), 'max_abs_error': r.get('max_abs_error'), 'total_seconds': r.get('total_seconds')}, indent=2))"
          fi
          if [ -f reports/bonsai-lowbit-quantized-inventory/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-lowbit-quantized-inventory/report.json').read_text()); print(json.dumps({'quantized_prefix_count': r.get('quantized_prefix_count'), 'single_transformer_quantized_count': r.get('single_transformer_quantized_count'), 'transformer_blocks_quantized_count': r.get('transformer_blocks_quantized_count'), 'other_quantized_count': r.get('other_quantized_count'), 'all_quantized_prefixes_classified': r.get('all_quantized_prefixes_classified')}, indent=2))"
          fi
          if [ -f reports/bonsai-double-block-inventory/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-double-block-inventory/report.json').read_text()); print(json.dumps({'block_prefix': r.get('block_prefix'), 'static_inventory_only': r.get('static_inventory_only'), 'checkpoint_block_key_count': r.get('checkpoint_block_key_count'), 'recovered_block_key_count': r.get('recovered_block_key_count'), 'quantized_key_count': r.get('quantized_key_count'), 'passthrough_key_count': r.get('passthrough_key_count'), 'all_checkpoint_block_keys_recoverable': r.get('all_checkpoint_block_keys_recoverable')}, indent=2))"
          fi
          if [ -f reports/bonsai-lowbit-double-block-core/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-lowbit-double-block-core/report.json').read_text()); print(json.dumps({'uses_lowbit_source': r.get('uses_lowbit_source'), 'writes_expanded_checkpoint': r.get('writes_expanded_checkpoint'), 'not_full_diffusers_block': r.get('not_full_diffusers_block'), 'allclose': r.get('allclose_rtol_1e_4_atol_1e_5'), 'max_abs_error': r.get('max_abs_error'), 'outputs': r.get('outputs')}, indent=2))"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-lowbit-single-block-cores-report
          path: |
            reports/bonsai-lowbit-single-block-cores/report.json
            reports/bonsai-lowbit-quantized-inventory/report.json
            reports/bonsai-double-block-inventory/report.json
            reports/bonsai-lowbit-double-block-core/report.json
          retention-days: 7
