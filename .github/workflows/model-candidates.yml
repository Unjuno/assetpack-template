name: model-candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - run: python scripts/write_model_candidate_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-candidate-report
          path: reports/
          retention-days: 7
