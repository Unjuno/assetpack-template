name: bonsai-text-embedding-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub safetensors transformers accelerate
      - name: Probe tokenizer smoke
        continue-on-error: true
        run: python scripts/probe_bonsai_tokenizer_smoke.py
      - name: Probe text embedding smoke
        continue-on-error: true
        run: python scripts/probe_bonsai_text_embedding_smoke.py
      - name: Show report summaries
        if: always()
        run: |
          find reports -name report.json -print | sort | while read -r f; do
            echo "--- $f"
            python -c "import json,sys; r=json.load(open(sys.argv[1])); keys=['target','ok','tokenizer_success','embedding_success','success_count','blocked_by_hf_429','used_hf_token_env','model_class','tokenizer_class','input_ids_shape','error']; print(json.dumps({k:r.get(k) for k in keys if k in r}, indent=2, ensure_ascii=False))" "$f"
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-text-embedding-smoke-report
          path: reports/**/report.json
          retention-days: 7
