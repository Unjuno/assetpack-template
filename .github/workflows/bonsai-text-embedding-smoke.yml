name: bonsai-text-embedding-smoke
on: workflow_dispatch
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip && pip install --no-cache-dir torch --index-url https://download.pytorch.org/