name: bonsai-lowbit-runner-ci

on:
  push:
    branches:
      - main
    paths:
      - scripts/run_bonsai_lowbit_single_stream_chain.py
      - scripts/export_bonsai_lowbit_single_block_modulated_onnx.py
      - scripts/export_bonsai_lowbit_two_single_blocks_modulated_onnx.py
      - scripts/bonsai_lowbit_recover.py
      - .github/workflows/bonsai-lowbit-runner-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torch-runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install low-bit runner dependencies
        run: |
          python --version
          df -h
          free -h
          nproc
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors numpy

      - name: Run two-block low-bit torch runner
        run: |
          set -euo pipefail
          python scripts/run_bonsai_lowbit_single_stream_chain.py --blocks 2 --batch 1 --seq 4

      - name: Check runner report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/bonsai-lowbit-single-stream-chain-runner/report.json')
          r = json.loads(p.read_text())
          assert r['ok'] is True
          assert r['backend'] == 'torch_cpu'
          assert r['uses_lowbit_source'] is True
          assert r['writes_expanded_checkpoint'] is False
          assert r['is_full_bonsai_pipeline'] is False
          assert r['is_prompt_to_image_pipeline'] is False
          assert r['block_count'] == 2
          print(json.dumps({
            'ok': r['ok'],
            'backend': r['backend'],
            'block_count': r['block_count'],
            'segment_count': r['segment_count'],
            'final_hidden_shape': r['final_hidden_shape'],
            'claim': r['claim'],
          }, indent=2))
          PY

      - name: Upload runner report JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-lowbit-single-stream-chain-runner-report-json
          path: reports/**/report.json
          retention-days: 7
