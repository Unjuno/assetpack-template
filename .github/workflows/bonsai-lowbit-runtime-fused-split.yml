name: bonsai-lowbit-runtime-fused-split

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub

      - name: Probe low-bit fused projection split
        run: |
          python scripts/probe_bonsai_lowbit_runtime_fused_split.py

      - name: Show probe summary
        if: always()
        run: |
          if [ -f reports/bonsai-lowbit-runtime-fused-split/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-lowbit-runtime-fused-split/report.json').read_text()); print(json.dumps({'uses_lowbit_source': r.get('uses_lowbit_source'), 'writes_expanded_checkpoint': r.get('writes_expanded_checkpoint'), 'fused_projection_count': r.get('fused_projection_count'), 'failure_count': r.get('failure_count'), 'all_passed': r.get('all_passed'), 'max_abs_error': r.get('max_abs_error')}, indent=2))"
          fi

      - name: Upload fused split report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-lowbit-runtime-fused-split-report
          path: reports/bonsai-lowbit-runtime-fused-split/report.json
          retention-days: 7
