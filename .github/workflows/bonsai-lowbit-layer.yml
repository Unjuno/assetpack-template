name: bonsai-lowbit-layer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonsai-lowbit-layer-queue
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub

      - name: Probe one low-bit layer
        run: |
          python scripts/probe_bonsai_lowbit_layer.py

      - name: Upload low-bit layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-lowbit-layer-report
          path: reports/bonsai-lowbit-layer/
          retention-days: 7
