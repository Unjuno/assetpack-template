name: bonsai-transformer-load-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bonsai-transformer-load-probe.yml
      - scripts/run_bonsai_combined_component_probe.py
      - experiments/bonsai-onnx-smoke.yml

permissions:
  contents: write

jobs:
  transformer-load-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      BONSAI_RUN_TRANSFORMER_LOAD: "true"
      BONSAI_REQUIRE_ALL_COMBINED_CLAIMS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install transformer load probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub hf_transfer safetensors diffusers transformers accelerate

      - name: Self-test combined component probe
        run: |
          python scripts/run_bonsai_combined_component_probe.py --self-test

      - name: Run transformer weight load probe
        run: |
          python scripts/run_bonsai_combined_component_probe.py --out-dir reports/bonsai-transformer-load-probe

      - name: Show transformer load probe summary
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-transformer-load-probe/report.json').read_text()); print(json.dumps({'status': r.get('status'), 'ci_conclusion': r.get('ci_conclusion'), 'claim_promotable_to_manifest': r.get('claim_promotable_to_manifest'), 'run_transformer_load': r.get('run_transformer_load'), 'promotable_claims': r.get('promotable_claims'), 'stages': [(s.get('name'), s.get('status'), s.get('claim_promotable_to_manifest'), s.get('error_type')) for s in r.get('stages', [])]}, indent=2))"
          fi

      - name: Upload transformer load probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-transformer-load-probe-report-json
          path: reports/bonsai-transformer-load-probe/report.json
          retention-days: 7

      - name: Persist transformer load probe report in repo
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            mkdir -p docs/ci
            cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/bonsai-transformer-load-probe-latest.json
            if git diff --cached --quiet; then
              echo "No transformer load probe report changes to commit."
            else
              git commit -m "Record Bonsai transformer load probe CI report"
              git push
            fi
          fi
