name: bonsai-transformer-load-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bonsai-transformer-load-probe.yml
      - scripts/run_bonsai_transformer_load_probe.py
      - scripts/run_bonsai_transformer_double_trig_probe.py
      - experiments/bonsai-onnx-smoke.yml

permissions:
  contents: write

jobs:
  transformer-load-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      BONSAI_HF_RETRY_ATTEMPTS: "4"
      BONSAI_HF_RETRY_SLEEP_SECONDS: "30"
      BONSAI_RUN_TRANSFORMER_ONNX_EXPORT: "true"
      BONSAI_TRANSFORMER_ONNX_EXPORT_REVISION: "v8"
      BONSAI_RUN_TRANSFORMER_ONNXRUNTIME_LOAD: "true"
      BONSAI_TRANSFORMER_ONNXRUNTIME_LOAD_REVISION: "v11"
      BONSAI_RUN_TRANSFORMER_ONNXRUNTIME_TRIG_CAST_PATCH: "true"
      BONSAI_TRANSFORMER_ONNXRUNTIME_TRIG_CAST_PATCH_REVISION: "v8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write preflight report
        run: |
          mkdir -p reports/bonsai-transformer-load-probe
          cat > reports/bonsai-transformer-load-probe/report.json <<'JSON'
          {
            "experiment_id": "bonsai-transformer-load-probe-preflight-v12",
            "model_ref": "prism-ml/bonsai-image-binary-4B-unpacked",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "bonsai_real_transformer_weight_load_verified_not_onnx_execution",
            "dependency_stage": "pre_dependency_install",
            "onnx_export_attempted": true,
            "onnx_export_revision": "v8",
            "onnxruntime_load_attempted": true,
            "onnxruntime_load_revision": "v11",
            "onnxruntime_trig_cast_patch_attempted": true,
            "onnxruntime_trig_cast_patch_revision": "v8",
            "double_trig_cast_probe_revision": "v1",
            "execution_attempted": false,
            "note": "This preflight report is committed before dependency installation. Later workflow stages overwrite it if they are reached."
          }
          JSON

      - name: Persist current report in repo
        run: |
          mkdir -p docs/ci
          cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/bonsai-transformer-load-probe-latest.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Bonsai transformer staged CI report"
            git push
          fi

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install torch dependency
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Write torch-installed report
        run: |
          cat > reports/bonsai-transformer-load-probe/report.json <<'JSON'
          {
            "experiment_id": "bonsai-transformer-load-probe-dependencies-v12",
            "model_ref": "prism-ml/bonsai-image-binary-4B-unpacked",
            "status": "torch_dependency_installed",
            "ci_conclusion": "dependency_stage_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "bonsai_real_transformer_weight_load_verified_not_onnx_execution",
            "dependency_stage": "torch_installed_before_runtime_deps",
            "onnx_export_attempted": true,
            "onnx_export_revision": "v8",
            "onnxruntime_load_attempted": true,
            "onnxruntime_load_revision": "v11",
            "onnxruntime_trig_cast_patch_attempted": true,
            "onnxruntime_trig_cast_patch_revision": "v8",
            "double_trig_cast_probe_revision": "v1",
            "execution_attempted": false,
            "note": "Torch CPU dependency installation completed. Runtime dependencies and Bonsai probe have not yet completed at this stage."
          }
          JSON

      - name: Persist current report in repo after torch
        run: |
          mkdir -p docs/ci
          cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
          git add docs/ci/bonsai-transformer-load-probe-latest.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Bonsai transformer staged CI report"
            git push
          fi

      - name: Install runtime dependencies
        run: |
          pip install --no-cache-dir pyyaml huggingface_hub hf_transfer safetensors diffusers transformers accelerate onnx onnxscript onnxruntime

      - name: Write dependency-ready report
        run: |
          cat > reports/bonsai-transformer-load-probe/report.json <<'JSON'
          {
            "experiment_id": "bonsai-transformer-load-probe-dependencies-v12",
            "model_ref": "prism-ml/bonsai-image-binary-4B-unpacked",
            "status": "all_dependencies_installed",
            "ci_conclusion": "dependency_stage_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "bonsai_real_transformer_weight_load_verified_not_onnx_execution",
            "dependency_stage": "all_dependencies_installed_before_probe_script",
            "onnx_export_attempted": true,
            "onnx_export_revision": "v8",
            "onnxruntime_load_attempted": true,
            "onnxruntime_load_revision": "v11",
            "onnxruntime_trig_cast_patch_attempted": true,
            "onnxruntime_trig_cast_patch_revision": "v8",
            "double_trig_cast_probe_revision": "v1",
            "execution_attempted": false,
            "note": "All declared Python dependencies installed. The Bonsai transformer probe script has not yet completed at this stage."
          }
          JSON

      - name: Persist current report in repo after runtime deps
        run: |
          mkdir -p docs/ci
          cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
          git add docs/ci/bonsai-transformer-load-probe-latest.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Bonsai transformer staged CI report"
            git push
          fi

      - name: Run transformer DOUBLE trig load probe
        run: |
          python scripts/run_bonsai_transformer_double_trig_probe.py --out-dir reports/bonsai-transformer-load-probe

      - name: Show report
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            python -m json.tool reports/bonsai-transformer-load-probe/report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-transformer-load-probe-report-json
          path: reports/bonsai-transformer-load-probe/report.json
          retention-days: 7

      - name: Persist final report in repo
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            mkdir -p docs/ci
            cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
            git add docs/ci/bonsai-transformer-load-probe-latest.json
            if git diff --cached --quiet; then
              echo "No report changes to commit."
            else
              git commit -m "Record Bonsai transformer load probe CI report"
              git push
            fi
          fi
