name: bonsai-transformer-load-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bonsai-transformer-load-probe.yml
      - scripts/run_bonsai_transformer_load_probe.py
      - experiments/bonsai-onnx-smoke.yml

permissions:
  contents: write

jobs:
  transformer-load-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      BONSAI_HF_RETRY_ATTEMPTS: "3"
      BONSAI_HF_RETRY_SLEEP_SECONDS: "20"
      BONSAI_RUN_TRANSFORMER_ONNX_EXPORT: "true"
      BONSAI_TRANSFORMER_ONNX_EXPORT_REVISION: "v3"
      BONSAI_RUN_TRANSFORMER_ONNXRUNTIME_LOAD: "true"
      BONSAI_TRANSFORMER_ONNXRUNTIME_LOAD_REVISION: "v5"
      BONSAI_RUN_TRANSFORMER_ONNXRUNTIME_TRIG_CAST_PATCH: "true"
      BONSAI_TRANSFORMER_ONNXRUNTIME_TRIG_CAST_PATCH_REVISION: "v2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub hf_transfer safetensors diffusers transformers accelerate onnx onnxscript onnxruntime

      - name: Run transformer load probe
        run: |
          python scripts/run_bonsai_transformer_load_probe.py --out-dir reports/bonsai-transformer-load-probe

      - name: Show report
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            python -m json.tool reports/bonsai-transformer-load-probe/report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-transformer-load-probe-report-json
          path: reports/bonsai-transformer-load-probe/report.json
          retention-days: 7

      - name: Persist report in repo
        if: always()
        run: |
          if [ -f reports/bonsai-transformer-load-probe/report.json ]; then
            mkdir -p docs/ci
            cp reports/bonsai-transformer-load-probe/report.json docs/ci/bonsai-transformer-load-probe-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/bonsai-transformer-load-probe-latest.json
            if git diff --cached --quiet; then
              echo "No report changes to commit."
            else
              git commit -m "Record Bonsai transformer load probe CI report"
              git push
            fi
          fi
