name: asset-generate-and-store

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        default: tiny-sd
        type: choice
        options:
          - tiny-sd
          - sd-turbo
          - bk-sdm-tiny

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install pyyaml pillow torch diffusers transformers accelerate safetensors

      - run: python scripts/run_diffusers_smoke.py --model "${{ inputs.model }}" --out reports/diffusers-smoke

      - run: python scripts/persist_result.py reports/diffusers-smoke "${{ inputs.model }}"

      - name: Commit stored result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ reports/model-results.jsonl
          git commit -m "Store generated asset result for ${{ inputs.model }}" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-generate-and-store-${{ inputs.model }}
          path: reports/diffusers-smoke/
          retention-days: 7
