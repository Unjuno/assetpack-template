name: ort-cpu-kernel-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ort-cpu-kernel-probe.yml
      - scripts/run_ort_cpu_kernel_probe.py

permissions:
  contents: write

jobs:
  ort-cpu-kernel-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      ORT_CPU_KERNEL_PROBE_REVISION: "v3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write preflight report
        run: |
          mkdir -p reports/ort-cpu-kernel-probe
          cat > reports/ort-cpu-kernel-probe/report.json <<'JSON'
          {
            "experiment_id": "ort-cpu-kernel-probe-preflight-v3",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "synthetic_ort_cpu_cos_float16_cast_workaround_evidence_not_bonsai_pipeline",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_ort_cpu_kernel_probe.py if dependency installation and probe execution succeed."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir onnx onnxruntime

      - name: Run ORT CPU kernel probe
        run: |
          python scripts/run_ort_cpu_kernel_probe.py --out-dir reports/ort-cpu-kernel-probe

      - name: Show report
        if: always()
        run: |
          if [ -f reports/ort-cpu-kernel-probe/report.json ]; then
            python -m json.tool reports/ort-cpu-kernel-probe/report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ort-cpu-kernel-probe-report-json
          path: reports/ort-cpu-kernel-probe/report.json
          retention-days: 7

      - name: Persist report in repo
        if: always()
        run: |
          if [ -f reports/ort-cpu-kernel-probe/report.json ]; then
            mkdir -p docs/ci
            cp reports/ort-cpu-kernel-probe/report.json docs/ci/ort-cpu-kernel-probe-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/ort-cpu-kernel-probe-latest.json
            if git diff --cached --quiet; then
              echo "No report changes to commit."
            else
              git commit -m "Record ORT CPU kernel probe CI report"
              git push
            fi
          fi
