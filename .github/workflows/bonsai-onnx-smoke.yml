name: bonsai-onnx-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonsai-onnx-smoke-queue
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml optimum[onnxruntime] diffusers transformers accelerate safetensors torch

      - name: Probe Bonsai ONNX export
        run: |
          python scripts/run_bonsai_onnx_probe.py

      - name: Upload Bonsai ONNX probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-onnx-smoke-report
          path: reports/bonsai-onnx-smoke/
          retention-days: 7
