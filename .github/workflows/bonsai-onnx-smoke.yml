name: bonsai-onnx-smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bonsai ONNX smoke target"
        required: true
        type: choice
        default: layout-boundary
        options:
          - layout-boundary
          - export
  push:
    branches:
      - main
    paths:
      - .github/workflows/bonsai-onnx-smoke.yml
      - scripts/run_bonsai_onnx_probe.py
      - experiments/bonsai-onnx-smoke.yml

permissions:
  contents: read

concurrency:
  group: bonsai-onnx-smoke-${{ github.event_name }}-${{ github.event.inputs.target || 'push-layout-boundary' }}
  cancel-in-progress: false

jobs:
  layout-boundary:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'layout-boundary') }}
    name: layout-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      BONSAI_REQUIRED_MILESTONE: layout_probe
      BONSAI_DOWNLOAD_WEIGHTS: "false"
      BONSAI_ALLOW_EXTERNAL_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install layout probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyyaml huggingface_hub

      - name: Self-test Bonsai script
        run: |
          python scripts/run_bonsai_onnx_probe.py --self-test

      - name: Run Bonsai layout boundary probe
        run: |
          python scripts/run_bonsai_onnx_probe.py --out-dir reports/bonsai-layout-boundary

      - name: Show layout boundary report summary
        if: always()
        run: |
          if [ -f reports/bonsai-layout-boundary/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-layout-boundary/report.json').read_text()); stage=next((s for s in r.get('stages', []) if s.get('name') == 'layout_probe'), {}); analysis=stage.get('analysis', {}); print(json.dumps({'status': r.get('status'), 'ci_conclusion': r.get('ci_conclusion'), 'claim_promotable_to_manifest': r.get('claim_promotable_to_manifest'), 'required_milestone': r.get('required_milestone'), 'milestone_reached': r.get('milestone_reached'), 'download_weights': r.get('download_weights'), 'external_rate_limited': r.get('external_rate_limited'), 'error_type': r.get('error_type'), 'error': r.get('error'), 'has_model_index_json': analysis.get('has_model_index_json'), 'top_level_entries': analysis.get('top_level_entries'), 'component_candidates': analysis.get('component_candidates')}, indent=2))"
          fi

      - name: Upload Bonsai layout boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-layout-boundary-report-json
          path: reports/bonsai-layout-boundary/report.json
          retention-days: 7

  export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'export' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub hf_transfer safetensors onnx onnxscript onnxruntime diffusers transformers accelerate

      - name: Verify Python packages
        run: |
          python -c "import torch, onnx, onnxruntime as ort, onnxscript, diffusers, transformers, huggingface_hub; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); print('onnx', onnx.__version__); print('onnxruntime', ort.__version__); print('onnxscript', onnxscript.__version__); print('diffusers', diffusers.__version__); print('transformers', transformers.__version__); print('huggingface_hub', huggingface_hub.__version__); print('ort_providers', ort.get_available_providers())"

      - name: Self-test Bonsai script
        run: |
          python scripts/run_bonsai_onnx_probe.py --self-test

      - name: Run Bonsai staged check
        run: |
          python scripts/run_bonsai_onnx_probe.py

      - name: Show report summary
        if: always()
        run: |
          if [ -f reports/bonsai-onnx-smoke/report.json ]; then
            python -c "import json; from pathlib import Path; r=json.loads(Path('reports/bonsai-onnx-smoke/report.json').read_text()); print(json.dumps({'status': r.get('status'), 'ci_conclusion': r.get('ci_conclusion'), 'claim_promotable_to_manifest': r.get('claim_promotable_to_manifest'), 'required_milestone': r.get('required_milestone'), 'milestone_reached': r.get('milestone_reached'), 'error_type': r.get('error_type'), 'error': r.get('error'), 'stages': [(s.get('name'), s.get('status'), s.get('error_type')) for s in r.get('stages', [])]}, indent=2))"
          fi

      - name: Upload Bonsai report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-onnx-smoke-report
          path: reports/bonsai-onnx-smoke/
          retention-days: 7
