name: image-model-onnx-feasibility-dynamic

on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Optional comma-separated candidate IDs. Empty means all enabled candidates."
        required: false
        default: ""
      batches:
        description: "Optional comma-separated batches. Empty means all batches."
        required: false
        default: ""
      include_placeholders:
        description: "Include placeholder/runtime candidates."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: image-model-onnx-feasibility-dynamic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build candidate matrix from config
        id: matrix
        env:
          INPUT_CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
          INPUT_BATCHES: ${{ github.event.inputs.batches }}
          INPUT_INCLUDE_PLACEHOLDERS: ${{ github.event.inputs.include_placeholders }}
        run: |
          python -m pip install --no-cache-dir pyyaml
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path('experiments/image-model-ci-benchmark.yml').read_text())
          candidate_ids = {x.strip() for x in os.environ.get('INPUT_CANDIDATE_IDS', '').split(',') if x.strip()}
          batches = {x.strip() for x in os.environ.get('INPUT_BATCHES', '').split(',') if x.strip()}
          include_placeholders = os.environ.get('INPUT_INCLUDE_PLACEHOLDERS', 'true').lower() == 'true'
          items = []
          for c in cfg.get('candidates', []):
              cid = c.get('id')
              if not c.get('enabled', False):
                  continue
              if candidate_ids and cid not in candidate_ids:
                  continue
              if batches and c.get('batch') not in batches:
                  continue
              if not include_placeholders and c.get('ci_stage') == 'placeholder':
                  continue
              items.append({'candidate_id': cid})
          payload = json.dumps(items, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'matrix={payload}\n')
              f.write(f'count={len(items)}\n')
          print(payload)
          PY

  onnx-feasibility:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_ONNX_FEASIBILITY_DYNAMIC_REVISION: "v1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write ONNX feasibility preflight report
        run: |
          mkdir -p reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}
          cat > reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json <<JSON
          {
            "experiment_id": "image-model-onnx-feasibility-dynamic-preflight-v1",
            "candidate_id": "${{ matrix.candidate_id }}",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_onnx_feasibility_measurement_not_full_pipeline",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_image_model_onnx_feasibility.py if dependency installation and ONNX feasibility probing run."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow sentencepiece protobuf onnx onnxruntime onnxscript

      - name: Run ONNX feasibility probe
        run: |
          python scripts/run_image_model_onnx_feasibility.py \
            --config experiments/image-model-ci-benchmark.yml \
            --out-dir reports/image-model-onnx-feasibility/${{ matrix.candidate_id }} \
            --candidate-ids "${{ matrix.candidate_id }}"

      - name: Show ONNX feasibility report
        if: always()
        run: |
          if [ -f reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json ]; then
            python -m json.tool reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json
          fi

      - name: Upload ONNX feasibility report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-onnx-feasibility-${{ matrix.candidate_id }}
          path: |
            reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json
            reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/candidates/**/onnx/*
          if-no-files-found: warn
          retention-days: 7

      - name: Persist ONNX feasibility report in repo
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json ]; then
            exit 0
          fi
          mkdir -p docs/ci/image-model-onnx-feasibility
          cp reports/image-model-onnx-feasibility/${{ matrix.candidate_id }}/report.json docs/ci/image-model-onnx-feasibility/${{ matrix.candidate_id }}-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/image-model-onnx-feasibility/${{ matrix.candidate_id }}-latest.json
          if git diff --cached --quiet; then
            echo "No ONNX feasibility report changes to commit for ${{ matrix.candidate_id }}."
            exit 0
          fi
          git commit -m "Record image model ONNX feasibility ${{ matrix.candidate_id }} report"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              pushed=true
              break
            fi
            echo "Push failed for ${{ matrix.candidate_id }}, retry $i"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to persist ONNX feasibility report for ${{ matrix.candidate_id }} after retries."
            exit 1
          fi
