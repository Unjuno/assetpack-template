name: image-model-ci-curated-rabbits

on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Optional comma-separated candidate IDs. Empty means all curated rabbit candidates."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: image-model-ci-curated-rabbits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build curated rabbit candidate matrix
        id: matrix
        env:
          INPUT_CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
        run: |
          python -m pip install --no-cache-dir pyyaml
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('experiments/image-model-ci-curated-rabbits.yml').read_text())
          requested = {x.strip() for x in os.environ.get('INPUT_CANDIDATE_IDS', '').split(',') if x.strip()}
          items = []
          for c in cfg.get('candidates', []):
              cid = c.get('id')
              if not c.get('enabled', False):
                  continue
              if requested and cid not in requested:
                  continue
              items.append({'candidate_id': cid})
          payload = json.dumps(items, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'matrix={payload}\n')
              f.write(f'count={len(items)}\n')
          print(payload)
          PY

  curated-rabbit:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_CI_CURATED_RABBITS_REVISION: "v1"
      IMAGE_MODEL_CANDIDATE_TIMEOUT_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write curated rabbit preflight report
        run: |
          mkdir -p reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}
          cat > reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json <<JSON
          {
            "experiment_id": "image-model-ci-curated-rabbits-preflight-v1",
            "candidate_id": "${{ matrix.candidate_id }}",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_curated_rabbit_measurement_not_model_quality_claim",
            "prompt": "a cute small rabbit sitting in a bonsai pot, detailed fur, natural rabbit anatomy, long ears, studio lighting, sharp focus",
            "execution_attempted": false,
            "candidate_timeout_seconds": 900,
            "note": "This preflight report is overwritten by scripts/run_image_model_ci_benchmark.py if benchmark execution runs. Rabbit candidates are subject-transfer tests from the strict accepted cat set and are not yet visually validated for rabbits."
          }
          JSON
      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow sentencepiece protobuf peft
      - name: Run curated rabbit benchmark
        run: |
          python scripts/run_image_model_ci_benchmark.py \
            --config experiments/image-model-ci-curated-rabbits.yml \
            --out-dir reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }} \
            --candidate-ids "${{ matrix.candidate_id }}" \
            --candidate-timeout-seconds 900
      - name: Show curated rabbit report
        if: always()
        run: |
          if [ -f reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json ]; then
            python -m json.tool reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json
          fi
      - name: Upload curated rabbit report and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ci-curated-rabbit-${{ matrix.candidate_id }}
          path: |
            reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json
            reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/images/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Persist curated rabbit report in repo
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json ]; then exit 0; fi
          mkdir -p docs/ci/image-model-ci-curated-rabbits
          cp reports/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}/report.json docs/ci/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/image-model-ci-curated-rabbits/${{ matrix.candidate_id }}-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record image model curated rabbit ${{ matrix.candidate_id }} report"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then pushed=true; break; fi
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then exit 1; fi
