name: bonsai-unpacked-transformer-loader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir huggingface_hub safetensors diffusers transformers accelerate

      - name: Probe unpacked transformer loader
        run: |
          python scripts/probe_bonsai_unpacked_transformer_loader.py

      - name: Upload loader report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-unpacked-transformer-loader-report
          path: reports/bonsai-unpacked-transformer-loader/
          retention-days: 7
