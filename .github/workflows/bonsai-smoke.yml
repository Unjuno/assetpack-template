name: bonsai-smoke

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: bonsai-smoke-queue
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Observe workflow queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow bonsai-smoke.yml --status queued --limit 20 || true
          gh run list --workflow bonsai-smoke.yml --status in_progress --limit 20 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow torch diffusers transformers accelerate safetensors

      - name: Run Bonsai CPU smoke test
        run: |
          python scripts/run_bonsai_smoke.py

      - name: Upload Bonsai smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-smoke-report
          path: reports/bonsai-smoke/
          retention-days: 7
