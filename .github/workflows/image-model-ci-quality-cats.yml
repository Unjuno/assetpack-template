name: image-model-ci-quality-cats

on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Optional comma-separated candidate IDs. Empty means all quality candidates."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: image-model-ci-quality-cats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build quality candidate matrix
        id: matrix
        env:
          INPUT_CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
        run: |
          python -m pip install --no-cache-dir pyyaml
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path('experiments/image-model-ci-quality-cats.yml').read_text())
          requested = {x.strip() for x in os.environ.get('INPUT_CANDIDATE_IDS', '').split(',') if x.strip()}
          items = []
          for c in cfg.get('candidates', []):
              cid = c.get('id')
              if not c.get('enabled', False):
                  continue
              if requested and cid not in requested:
                  continue
              items.append({'candidate_id': cid})
          payload = json.dumps(items, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'matrix={payload}\n')
              f.write(f'count={len(items)}\n')
          print(payload)
          PY

  quality-cat:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_CI_QUALITY_CATS_REVISION: "v1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write quality cat preflight report
        run: |
          mkdir -p reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}
          cat > reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json <<JSON
          {
            "experiment_id": "image-model-ci-quality-cats-preflight-v1",
            "candidate_id": "${{ matrix.candidate_id }}",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_quality_cat_measurement_not_model_quality_claim",
            "prompt": "a cute orange tabby cat sitting in a bonsai pot, detailed fur, natural cat anatomy, studio lighting, sharp focus",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_image_model_ci_benchmark.py if benchmark execution runs."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow sentencepiece protobuf peft

      - name: Run quality cat benchmark
        run: |
          python scripts/run_image_model_ci_benchmark.py \
            --config experiments/image-model-ci-quality-cats.yml \
            --out-dir reports/image-model-ci-quality-cats/${{ matrix.candidate_id }} \
            --candidate-ids "${{ matrix.candidate_id }}"

      - name: Show quality cat report
        if: always()
        run: |
          if [ -f reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json ]; then
            python -m json.tool reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json
          fi

      - name: Upload quality cat report and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ci-quality-cat-${{ matrix.candidate_id }}
          path: |
            reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json
            reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/images/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Persist quality cat report in repo
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json ]; then
            exit 0
          fi
          mkdir -p docs/ci/image-model-ci-quality-cats
          cp reports/image-model-ci-quality-cats/${{ matrix.candidate_id }}/report.json docs/ci/image-model-ci-quality-cats/${{ matrix.candidate_id }}-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/image-model-ci-quality-cats/${{ matrix.candidate_id }}-latest.json
          if git diff --cached --quiet; then
            echo "No quality cat report changes to commit for ${{ matrix.candidate_id }}."
            exit 0
          fi
          git commit -m "Record image model quality cat ${{ matrix.candidate_id }} report"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              pushed=true
              break
            fi
            echo "Push failed for ${{ matrix.candidate_id }}, retry $i"
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to persist quality cat report for ${{ matrix.candidate_id }} after retries."
            exit 1
          fi
