name: image-model-ci-benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/image-model-ci-benchmark.yml
      - scripts/run_image_model_ci_benchmark.py
      - experiments/image-model-ci-benchmark.yml

permissions:
  contents: write

jobs:
  image-model-ci-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_CI_BENCHMARK_REVISION: "v1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write preflight report
        run: |
          mkdir -p reports/image-model-ci-benchmark
          cat > reports/image-model-ci-benchmark/report.json <<'JSON'
          {
            "experiment_id": "image-model-ci-benchmark-preflight-v1",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_benchmark_measurement_not_model_quality_claim",
            "prompt": "a cute orange tabby cat sitting on a bonsai pot, simple studio lighting",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_image_model_ci_benchmark.py if dependency installation and benchmark execution run."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow

      - name: Run image model CI benchmark
        run: |
          python scripts/run_image_model_ci_benchmark.py \
            --config experiments/image-model-ci-benchmark.yml \
            --out-dir reports/image-model-ci-benchmark

      - name: Show report
        if: always()
        run: |
          if [ -f reports/image-model-ci-benchmark/report.json ]; then
            python -m json.tool reports/image-model-ci-benchmark/report.json
          fi

      - name: Upload benchmark report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ci-benchmark-report
          path: |
            reports/image-model-ci-benchmark/report.json
            reports/image-model-ci-benchmark/images/**/*.png
          retention-days: 7

      - name: Persist report in repo
        if: always()
        run: |
          if [ -f reports/image-model-ci-benchmark/report.json ]; then
            mkdir -p docs/ci
            cp reports/image-model-ci-benchmark/report.json docs/ci/image-model-ci-benchmark-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/image-model-ci-benchmark-latest.json
            if git diff --cached --quiet; then
              echo "No benchmark report changes to commit."
            else
              git commit -m "Record image model CI benchmark report"
              git push
            fi
          fi
