name: image-model-ci-benchmark

on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Comma-separated batches to run: smoke,lcm,turbo,load_only,runtime"
        required: false
        default: "smoke,lcm,turbo,load_only,runtime"
  push:
    branches:
      - main
    paths:
      - .github/workflows/image-model-ci-benchmark.yml
      - scripts/run_image_model_ci_benchmark.py
      - experiments/image-model-ci-benchmark.yml

permissions:
  contents: write

jobs:
  image-model-ci-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: smoke
            persist_name: image-model-ci-benchmark-smoke-latest.json
          - batch: lcm
            persist_name: image-model-ci-benchmark-lcm-latest.json
          - batch: turbo
            persist_name: image-model-ci-benchmark-turbo-latest.json
          - batch: load_only
            persist_name: image-model-ci-benchmark-load-only-latest.json
          - batch: runtime
            persist_name: image-model-ci-benchmark-runtime-latest.json
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_CI_BENCHMARK_REVISION: "v2"
      SELECTED_BATCH: ${{ matrix.batch }}
    steps:
      - name: Skip unrequested dispatch batch
        if: ${{ github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.batches, matrix.batch) }}
        run: |
          echo "Batch ${{ matrix.batch }} was not requested."
          exit 0

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write preflight report
        run: |
          mkdir -p reports/image-model-ci-benchmark/${{ matrix.batch }}
          cat > reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json <<JSON
          {
            "experiment_id": "image-model-ci-benchmark-preflight-v2",
            "batch": "${{ matrix.batch }}",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_benchmark_measurement_not_model_quality_claim",
            "prompt": "a cute orange tabby cat sitting on a bonsai pot, simple studio lighting",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_image_model_ci_benchmark.py if dependency installation and benchmark execution run."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow sentencepiece protobuf

      - name: Run image model CI benchmark batch
        run: |
          python scripts/run_image_model_ci_benchmark.py \
            --config experiments/image-model-ci-benchmark.yml \
            --out-dir reports/image-model-ci-benchmark/${{ matrix.batch }} \
            --batches "${{ matrix.batch }}"

      - name: Show report
        if: always()
        run: |
          if [ -f reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json ]; then
            python -m json.tool reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json
          fi

      - name: Upload benchmark report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ci-benchmark-${{ matrix.batch }}
          path: |
            reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json
            reports/image-model-ci-benchmark/${{ matrix.batch }}/images/**/*.png
          retention-days: 7

      - name: Persist batch report in repo
        if: always()
        run: |
          if [ -f reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json ]; then
            mkdir -p docs/ci
            cp reports/image-model-ci-benchmark/${{ matrix.batch }}/report.json docs/ci/${{ matrix.persist_name }}
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/${{ matrix.persist_name }}
            if git diff --cached --quiet; then
              echo "No benchmark report changes to commit for ${{ matrix.batch }}."
            else
              git commit -m "Record image model CI benchmark ${{ matrix.batch }} report"
              git pull --rebase || true
              git push || git push
            fi
          fi
