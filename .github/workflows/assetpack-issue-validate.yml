name: assetpack-issue-validate

"on":
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to validate manually"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  validate-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      ISSUE_BODY_FILE: ${{ runner.temp }}/issue-body.md
      OUT_DIR: reports/issue-generation/issue-${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyyaml

      - name: Fetch issue body
        run: |
          mkdir -p "$OUT_DIR"
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > "$ISSUE_BODY_FILE"

      - name: Validate request
        id: validate
        run: |
          python scripts/validate_issue_request.py \
            --config assetpack.yml \
            --issue-body-file "$ISSUE_BODY_FILE" \
            --issue-number "$ISSUE_NUMBER" \
            --out-dir "$OUT_DIR" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate request policy
        id: policy
        if: ${{ steps.validate.outputs.valid == 'true' }}
        run: |
          python scripts/validate_issue_policy.py \
            --config assetpack.yml \
            --request-json "$OUT_DIR/request.json" \
            --comment-file "$OUT_DIR/validation-comment.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Comment validation result
        if: ${{ steps.validate.outputs.valid != 'true' || steps.policy.outputs.valid != 'true' }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUT_DIR/validation-comment.md"

      - name: Comment accepted validation result
        if: ${{ steps.policy.outputs.valid == 'true' }}
        run: |
          {
            echo "## Asset request validation passed"
            echo ""
            echo "The structured request passed validation. The generation workflow may now process it."
            echo ""
            echo "- recipe: \`${{ steps.policy.outputs.recipe_id }}\`"
            echo "- model: \`${{ steps.policy.outputs.selected_model_id }}\`"
          } > "$OUT_DIR/validation-passed-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUT_DIR/validation-passed-comment.md"
