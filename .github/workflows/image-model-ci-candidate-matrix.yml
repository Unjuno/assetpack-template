name: image-model-ci-candidate-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/image-model-ci-candidate-matrix.yml
      - scripts/run_image_model_ci_benchmark.py
      - experiments/image-model-ci-benchmark.yml

permissions:
  contents: write

jobs:
  image-model-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate_id:
          - tiny-stable-diffusion-pipe
          - small-stable-diffusion-v0
          - segmind-tiny-sd
          - bk-sdm-tiny-load
          - bk-sdm-small-load
          - bk-sdm-base-load
          - lcm-dreamshaper-v7
          - sd15-lcm-lora
          - dreamshaper7-lcm-lora
          - openjourney-v4-lcm-lora
          - sd-turbo
          - sdxl-turbo-load
          - ssd-1b-load
          - segmind-vega-load
          - ssd-1b-lcm-lora-load
          - sdxl-lcm-lora-load
          - sd15-load-baseline
          - sd14-load-baseline
          - sd21-base-load
          - sdxl-base-load
          - sdxl-lightning-load
          - hyper-sd-load
          - pixart-alpha-load
          - pixart-sigma-load
          - playground-v25-load
          - sd35-medium-load
          - flux-schnell-load
          - qwen-image-load
          - taesd-component-placeholder
          - openvino-small-sd-placeholder
          - stable-diffusion-cpp-sd15-placeholder
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      IMAGE_MODEL_CI_CANDIDATE_MATRIX_REVISION: "v1"
      CANDIDATE_ID: ${{ matrix.candidate_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write candidate preflight report
        run: |
          mkdir -p reports/image-model-ci-candidate/${{ matrix.candidate_id }}
          cat > reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json <<JSON
          {
            "experiment_id": "image-model-ci-candidate-matrix-preflight-v1",
            "candidate_id": "${{ matrix.candidate_id }}",
            "status": "preflight_started",
            "ci_conclusion": "preflight_only",
            "claim_promotable_to_manifest": false,
            "allowed_claim": "ci_image_model_benchmark_measurement_not_model_quality_claim",
            "prompt": "a cute orange tabby cat sitting on a bonsai pot, simple studio lighting",
            "execution_attempted": false,
            "note": "This preflight report is overwritten by scripts/run_image_model_ci_benchmark.py if dependency installation and benchmark execution run."
          }
          JSON

      - name: Show runner resources
        run: |
          python --version
          df -h
          free -h
          nproc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir pyyaml huggingface_hub safetensors diffusers transformers accelerate pillow sentencepiece protobuf

      - name: Run candidate benchmark
        run: |
          python scripts/run_image_model_ci_benchmark.py \
            --config experiments/image-model-ci-benchmark.yml \
            --out-dir reports/image-model-ci-candidate/${{ matrix.candidate_id }} \
            --candidate-ids "${{ matrix.candidate_id }}"

      - name: Show candidate report
        if: always()
        run: |
          if [ -f reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json ]; then
            python -m json.tool reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json
          fi

      - name: Upload candidate report and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ci-candidate-${{ matrix.candidate_id }}
          path: |
            reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json
            reports/image-model-ci-candidate/${{ matrix.candidate_id }}/images/**/*.png
          retention-days: 7

      - name: Persist candidate report in repo
        if: always()
        run: |
          if [ -f reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json ]; then
            mkdir -p docs/ci/image-model-ci-candidates
            cp reports/image-model-ci-candidate/${{ matrix.candidate_id }}/report.json docs/ci/image-model-ci-candidates/${{ matrix.candidate_id }}-latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ci/image-model-ci-candidates/${{ matrix.candidate_id }}-latest.json
            if git diff --cached --quiet; then
              echo "No candidate report changes to commit for ${{ matrix.candidate_id }}."
              exit 0
            fi
            git commit -m "Record image model candidate ${{ matrix.candidate_id }} CI report"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push failed for ${{ matrix.candidate_id }}, retry $i"
              sleep $((i * 5))
            done
          fi
