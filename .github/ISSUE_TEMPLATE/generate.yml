name: Asset request
description: Submit structured fields for this repository's fixed-theme asset generator.
title: "[asset] "
labels:
  - asset-request
body:
  - type: markdown
    attributes:
      value: |
        Submit structured slots only. CI will build the final prompt from `assetpack.yml`.

  - type: input
    id: subject
    attributes:
      label: Subject
      placeholder: sleeping cat
    validations:
      required: true

  - type: input
    id: scene
    attributes:
      label: Scene
      placeholder: simple sitting pose
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: Audience
      placeholder: children
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      placeholder: simple shapes, no background clutter
    validations:
      required: false

  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - default
        - sdxl-turbo-quality
        - ssd-1b-lcm-lora-quality
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - CC0-1.0
        - CC-BY-4.0
        - OWNED
    validations:
      required: true
