experiment_id: image-model-ci-curated-cats-v3
prompt: "a cute orange tabby cat sitting in a bonsai pot, detailed fur, natural cat anatomy, studio lighting, sharp focus"
negative_prompt: "blurry, distorted, deformed, extra limbs, melted face, low quality, abstract object, not a cat"
seed: 12345
output_root: reports/image-model-ci-curated-cats
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "Strict curated list keeps only candidates accepted by user visual review from run 27442870440. Each candidate should still be treated as a measurement, not a model-quality claim."
selection_policy:
  keep_reason: "User accepted these seven candidates after reviewing image-model-ci-curated-cats run 27442870440 artifacts."
  exclude_reason: "Prior CI artifact either did not produce an image, produced a non-cat/abstract image, produced a severe artifact, is a placeholder/component-only runtime, or was removed from the strict seven-candidate review set."
  reviewed_runs:
    - workflow: image-model-ci-benchmark
      run_id: 27438333673
    - workflow: image-model-ci-quality-cats
      run_id: 27439200166
    - workflow: image-model-ci-remaining-cats
      run_id: 27438992693
    - workflow: image-model-ci-curated-cats
      run_id: 27442870440
kept_candidates:
  - lcm-dreamshaper-v7-quality
  - sd-turbo-quality
  - sdxl-lcm-lora-quality
  - sdxl-turbo-quality
  - segmind-vega-quality
  - ssd-1b-lcm-lora-quality
  - ssd-1b-quality
accepted_initial_review_candidates:
  - segmind-tiny-sd
  - lcm-dreamshaper-v7
  - sd-turbo
quality_variant_replacements:
  lcm-dreamshaper-v7: lcm-dreamshaper-v7-quality
  sd-turbo: sd-turbo-quality
excluded_candidates:
  no_or_failed_artifact:
    - dreamshaper7-lcm-lora-cat
    - sd21-base-cat
    - sdxl-lightning-cat
    - hyper-sd-cat
    - pixart-alpha-cat
    - pixart-sigma-cat
    - sd35-medium-cat
    - flux-schnell-cat
    - qwen-image-cat
    - taesd-component-placeholder
    - openvino-small-sd-placeholder
    - stable-diffusion-cpp-sd15-placeholder
  visually_unusable_or_not_cat:
    - bk-sdm-tiny-cat
    - bk-sdm-small-cat
    - bk-sdm-base-cat
    - sd14-baseline-cat
    - sd15-baseline-cat
    - sdxl-base-cat
  removed_from_strict_set_after_run_27442870440:
    - segmind-tiny-sd
    - openjourney-v4-lcm-lora-cat
    - playground-v25-cat
    - sd15-lcm-lora-cat
candidates:
  - id: lcm-dreamshaper-v7-quality
    enabled: true
    batch: curated
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: SimianLuo/LCM_Dreamshaper_v7
    pipeline_class: LatentConsistencyModelPipeline
    height: 384
    width: 384
    steps: 4
    guidance_scale: 8.0
    expected_role: curated_lcm_reference
    source_run_id: 27439200166
    strict_review_run_id: 27442870440
    prior_visual_judgment: recognizable_cat
    strict_visual_judgment: accepted_problem_not_observed
    notes: "Quality variant retained as replacement for accepted initial lcm-dreamshaper-v7. Accepted in strict seven-candidate review."

  - id: sd-turbo-quality
    enabled: true
    batch: curated
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: stabilityai/sd-turbo
    pipeline_class: AutoPipelineForText2Image
    height: 384
