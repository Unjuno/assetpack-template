    batch: curated
    ci_stage: generation
    method: diffusers_lora_text_to_image
    base_model_ref: stabilityai/stable-diffusion-xl-base-1.0
    lora_model_ref: latent-consistency/lcm-lora-sdxl
    pipeline_class: StableDiffusionXLPipeline
    scheduler_class: LCMScheduler
    height: 512
    width: 512
