experiment_id: image-model-ci-curated-cats-v2
prompt: "a cute orange tabby cat sitting in a bonsai pot, detailed fur, natural cat anatomy, studio lighting, sharp focus"
negative_prompt: "blurry, distorted, deformed, extra limbs, melted face, low quality, abstract object, not a cat"
seed: 12345
output_root: reports/image-model-ci-curated-cats
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "Curated list keeps only candidates that produced a visually recognizable cat image in prior CI artifacts. Each candidate should still be treated as a measurement, not a model-quality claim."
selection_policy:
  keep_reason: "Prior CI artifact produced a visually recognizable cat-like image, including accepted candidates from the first five-image review."
  exclude_reason: "Prior CI artifact either did not produce an image, produced a non-cat/abstract image, produced a severe artifact, or is a placeholder/component-only runtime."
  reviewed_runs:
    - workflow: image-model-ci-benchmark
      run_id: 27438333673
    - workflow: image-model-ci-quality-cats
      run_id: 27439200166
    - workflow: image-model-ci-remaining-cats
      run_id: 27438992693
kept_candidates:
  - segmind-tiny-sd
  - lcm-dreamshaper-v7-quality
  - sd-turbo-quality
  - sdxl-lcm-lora-quality
  - sdxl-turbo-quality
  - segmind-vega-quality
  - ssd-1b-lcm-lora-quality
  - ssd-1b-quality
  - openjourney-v4-lcm-lora-cat
  - playground-v25-cat
  - sd15-lcm-lora-cat
accepted_initial_review_candidates:
  - segmind-tiny-sd
  - lcm-dreamshaper-v7
  - sd-turbo
quality_variant_replacements:
  lcm-dreamshaper-v7: lcm-dreamshaper-v7-quality
  sd-turbo: sd-turbo-quality
excluded_candidates:
  no_or_failed_artifact:
    - dreamshaper7-lcm-lora-cat
    - sd21-base-cat
    - sdxl-lightning-cat
    - hyper-sd-cat
    - pixart-alpha-cat
    - pixart-sigma-cat
    - sd35-medium-cat
    - flux-schnell-cat
    - qwen-image-cat
    - taesd-component-placeholder
    - openvino-small-sd-placeholder
    - stable-diffusion-cpp-sd15-placeholder
  visually_unusable_or_not_cat:
    - bk-sdm-tiny-cat
    - bk-sdm-small-cat
    - bk-sdm-base-cat
    - sd14-baseline-cat
    - sd15-baseline-cat
    - sdxl-base-cat
candidates:
  - id: segmind-tiny-sd
    enabled: true
    batch: curated
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: segmind/tiny-sd
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 4
    guidance_scale: 7.5
    expected_role: curated_initial_small_sd_candidate
    license_hint: creativeml-openrail-m
    source_run_id: 27438333673
    prior_visual_judgment: accepted_initial_review_recognizable_cat
    notes: "Accepted from the first five-image review. Kept as exact original candidate because the separate quality variant looked less usable."

  - id: lcm-dreamshaper-v7-quality
    enabled: true
    batch: curated
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: SimianLuo/LCM_Dreamshaper_v7
    pipeline_class: LatentConsistencyModelPipeline
    height: 384
    width: 384
    steps: 4
    guidance_scale: 8.0
    expected_role: curated_lcm_reference
    source_run_id: 27439200166
    prior_visual_judgment: recognizable_cat
    notes: "Quality variant retained as replacement for accepted initial lcm-dreamshaper-v7."

  - id: sd-turbo-quality
    enabled: true
    batch: curated
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: stabilityai/sd-turbo
    pipeline_class: AutoPipelineForText2Image
    height: 384
    width: 384
    steps: 2
    guidance_scale: 0.0
    expected_role: curated_turbo_reference
    license_hint: stability-ai-noncommercial-community
    source_run_id: 27439200166
    prior_visual_judgment: recognizable_cat_closeup
    notes: "Quality variant retained as replacement for accepted initial sd-turbo."

  - id: sdxl-lcm-lora-quality
