experiment_id: image-model-ci-quality-cats-v1
prompt: "a cute orange tabby cat sitting in a bonsai pot, detailed fur, natural cat anatomy, studio lighting, sharp focus"
negative_prompt: "blurry, distorted, deformed, extra limbs, melted face, low quality, abstract object, not a cat"
seed: 12345
output_root: reports/image-model-ci-quality-cats
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "Quality candidates may be slow on GitHub-hosted CPU runners; preserve failures and timings."

candidates:
  - id: segmind-tiny-sd-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: segmind/tiny-sd
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 6
    guidance_scale: 7.5
    expected_role: current_best_small_sd_reference
    notes: "Keeps the current usable small baseline with slightly more steps."

  - id: lcm-dreamshaper-v7-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: SimianLuo/LCM_Dreamshaper_v7
    pipeline_class: LatentConsistencyModelPipeline
    height: 384
    width: 384
    steps: 4
    guidance_scale: 8.0
    expected_role: current_best_lcm_reference
    notes: "Current usable LCM baseline at higher resolution."

  - id: sd-turbo-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: stabilityai/sd-turbo
    pipeline_class: AutoPipelineForText2Image
    height: 384
    width: 384
    steps: 2
    guidance_scale: 0.0
    expected_role: current_best_turbo_reference
    license_hint: stability-ai-noncommercial-community
    notes: "Current usable turbo baseline at higher resolution."

  - id: sdxl-turbo-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: stabilityai/sdxl-turbo
    pipeline_class: AutoPipelineForText2Image
    height: 512
    width: 512
    steps: 1
    guidance_scale: 0.0
    expected_role: sdxl_turbo_quality_candidate
    license_hint: stability-ai-noncommercial-community
    notes: "Likely better image quality than SD Turbo; may be slower on CPU."

  - id: ssd-1b-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: segmind/SSD-1B
    pipeline_class: StableDiffusionXLPipeline
    height: 512
    width: 512
    steps: 8
    guidance_scale: 7.5
    expected_role: small_sdxl_quality_candidate
    license_hint: apache-2.0
    notes: "Small SDXL-class direct generation candidate."

  - id: segmind-vega-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: segmind/Segmind-Vega
    pipeline_class: StableDiffusionXLPipeline
    height: 512
    width: 512
    steps: 8
    guidance_scale: 7.5
    expected_role: small_sdxl_quality_candidate
    notes: "Segmind Vega direct generation candidate."

  - id: ssd-1b-lcm-lora-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_lora_text_to_image
    base_model_ref: segmind/SSD-1B
    lora_model_ref: latent-consistency/lcm-lora-ssd-1b
    pipeline_class: StableDiffusionXLPipeline
    scheduler_class: LCMScheduler
    height: 512
    width: 512
    steps: 4
    guidance_scale: 1.0
    expected_role: small_sdxl_lcm_quality_candidate
    notes: "SSD-1B with LCM-LoRA; requires peft."

  - id: sdxl-lcm-lora-quality
    enabled: true
    batch: quality
    ci_stage: generation
    method: diffusers_lora_text_to_image
    base_model_ref: stabilityai/stable-diffusion-xl-base-1.0
    lora_model_ref: latent-consistency/lcm-lora-sdxl
    pipeline_class: StableDiffusionXLPipeline
    scheduler_class: LCMScheduler
    height: 512
    width: 512
    steps: 4
    guidance_scale: 1.0
    expected_role: sdxl_lcm_quality_candidate
    notes: "SDXL + LCM-LoRA; slow but useful to test if CPU CI can produce a better cat."
