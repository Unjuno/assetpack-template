experiment_id: image-model-ci-benchmark-v3
prompt: "a cute orange tabby cat sitting on a bonsai pot, simple studio lighting"
negative_prompt: "blurry, distorted, low quality"
seed: 12345
output_root: reports/image-model-ci-benchmark
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "GitHub-hosted standard ubuntu runners are CPU-only; candidates should keep image size and steps small."

# Batches:
#   smoke: tiny/sentinel and small direct-generation candidates.
#   lcm: latent-consistency and few-step candidates likely to be useful on CPU.
#   turbo: distilled/turbo/lightning/hyper candidates; some are likely too heavy on standard runners.
#   load_only: quality baselines or heavy models checked only for load feasibility.
#   runtime: quantized/OpenVINO/cpp/component placeholders; enable after artifact selection.
candidates:
  - id: tiny-stable-diffusion-pipe
    enabled: true
    batch: smoke
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: hf-internal-testing/tiny-stable-diffusion-pipe
    pipeline_class: DiffusionPipeline
    height: 64
    width: 64
    steps: 2
    guidance_scale: 1.0
    expected_role: ci_sentinel
    notes: "Tiny pipeline for CI mechanics, not image quality."

  - id: small-stable-diffusion-v0
    enabled: true
    batch: smoke
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: OFA-Sys/small-stable-diffusion-v0
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 4
    guidance_scale: 7.5
    expected_role: small_sd_candidate
    license_hint: openrail
    notes: "Small Stable Diffusion candidate for CPU CI."

  - id: segmind-tiny-sd
    enabled: true
    batch: smoke
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: segmind/tiny-sd
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 4
    guidance_scale: 7.5
    expected_role: small_sd_candidate
    license_hint: creativeml-openrail-m
    notes: "Tiny SD candidate. Failure is useful evidence if repo or pipeline metadata differs."

  - id: bk-sdm-tiny-load
    enabled: true
    batch: smoke
    ci_stage: load_only
    method: diffusers_load_only
    model_ref: nota-ai/bk-sdm-tiny
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 4
    guidance_scale: 7.5
    expected_role: small_sd_load_candidate
    notes: "Load-only first because exact CI memory footprint should be measured before generation."

  - id: bk-sdm-small-load
    enabled: true
    batch: smoke
    ci_stage: load_only
    method: diffusers_load_only
    model_ref: nota-ai/bk-sdm-small
