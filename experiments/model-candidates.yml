id: model-candidates-v0
purpose: test which lightweight text-to-image candidates can run in public GitHub Actions CPU runners
runner: ubuntu-latest

limits:
  width: 256
  height: 256
  images_per_prompt: 1
  prompts: 3
  timeout_minutes_per_model: 20
  artifact_retention_days: 7

prompts:
  - id: cat-lineart
    prompt: simple black outline sleeping cat, white background, no text
  - id: game-potion
    prompt: small fantasy potion bottle icon, centered, simple shape, no text
  - id: blog-ai
    prompt: minimal conceptual illustration about artificial intelligence evaluation, no text

candidates:
  - id: tiny-sd
    enabled: true
    backend: diffusers
    model_ref: segmind/tiny-sd
    role: cpu-preview-candidate

  - id: sd-turbo
    enabled: true
    backend: diffusers
    model_ref: stabilityai/sd-turbo
    role: cpu-preview-candidate

  - id: bk-sdm-tiny
    enabled: true
    backend: diffusers
    model_ref: nota-ai/bk-sdm-tiny
    role: cpu-preview-candidate

  - id: bonsai-image-4b
    enabled: false
    backend: experimental
    model_ref: prism-ml/bonsai-image-binary-4B-unpacked
    role: cpu-smoke-experimental

  - id: onnxstream
    enabled: false
    backend: external-runner
    model_ref: onnxstream
    role: low-ram-experimental
