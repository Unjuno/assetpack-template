experiment_id: image-model-ci-final-runoff-hard-subjects-v1
prompt: "a realistic dragonfly perched on a tiny bonsai branch above a shallow ceramic bonsai pot, four transparent veined wings, six delicate legs, long segmented abdomen, large compound eyes, sharp macro studio lighting"
negative_prompt: "blurry, distorted, deformed, melted, low quality, abstract object, toy, extra body parts, missing legs, missing wings, fused limbs"
seed: 12345
output_root: reports/image-model-ci-final-runoff-hard-subjects
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "Final runoff stress test: 3 globally strongest candidates across 20 difficult subjects, one generated image per candidate-subject pair, 60 images total. Artifacts are uploaded only; reports are not committed to avoid 60 concurrent push jobs."
final_runoff:
