id: bonsai-onnx-smoke-v1
purpose: staged Bonsai Image 4B ONNX Runtime CPU experiment
runner: ubuntu-latest

limits:
  timeout_minutes: 180
  artifact_retention_days: 7

candidate:
  id: bonsai-image-4b-binary-unpacked
  backend: onnxruntime-cpu-component-export
  model_ref: prism-ml/bonsai-image-binary-4B-unpacked
  task: text-to-image
  library_name: diffusers

cpu_smoke:
  width: 128
  height: 128
  images_per_prompt: 1
  prompts:
    - id: bonsai-basic
      prompt: a simple bonsai tree, white background, no text

export:
  required_milestone: ort_cpu_forward
  download_weights: true
  component: vae_decoder
  milestones:
    - layout_probe
    - component_export
    - ort_cpu_forward
    - cpu_image_generation

policy:
  commit_outputs: false
  upload_artifact: true
  concurrency_group: bonsai-onnx-smoke-queue
  fail_if_required_milestone_not_reached: true
