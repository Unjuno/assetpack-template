  - id: sd15-lcm-lora-cat
    enabled: true
    batch: remaining
    ci_stage: generation
    method: diffusers_lora_text_to_image
    base_model_ref: stable-diffusion-v1-5/stable-diffusion-v1-5
    lora_model_ref: latent-consistency/lcm-lora-sdv1-5
    pipeline_class: StableDiffusionPipeline
