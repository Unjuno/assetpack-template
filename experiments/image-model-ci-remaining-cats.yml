experiment_id: image-model-ci-remaining-cats-v3
prompt: "a cute orange tabby cat sitting in a bonsai pot, detailed fur, natural cat anatomy, studio lighting, sharp focus"
negative_prompt: "blurry, distorted, deformed, extra limbs, melted face, low quality, abstract object, not a cat"
seed: 12345
output_root: reports/image-model-ci-remaining-cats
runtime:
  device: cpu
  torch_dtype: float32
  num_threads: 1
  save_images: true
  safety_checker: disabled_when_supported
  default_timeout_note: "This run excludes already reviewed candidates and candidates judged visually invalid as cat images."
excluded_already_reviewed:
  - tiny-stable-diffusion-pipe
  - small-stable-diffusion-v0
  - segmind-tiny-sd
  - lcm-dreamshaper-v7
  - sd-turbo
excluded_prior_quality_check:
  - sdxl-turbo-cat
  - ssd-1b-cat
  - segmind-vega-cat
  - ssd-1b-lcm-lora-cat
  - sdxl-lcm-lora-cat
excluded_visual_invalid:
  - bk-sdm-tiny-cat
  - bk-sdm-small-cat
  - bk-sdm-base-cat
  - sdxl-base-cat
candidates:
  - id: bk-sdm-tiny-cat
    enabled: false
    disabled_reason: "Visual review: generated image is heavily corrupted and not usable as a cat image."
    batch: remaining
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: nota-ai/bk-sdm-tiny
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 6
    guidance_scale: 7.5
    expected_role: remaining_small_sd_candidate

  - id: bk-sdm-small-cat
    enabled: false
    disabled_reason: "Visual review: generated image is heavily corrupted and not usable as a cat image."
    batch: remaining
    ci_stage: generation
    method: diffusers_text_to_image
    model_ref: nota-ai/bk-sdm-small
    pipeline_class: StableDiffusionPipeline
    height: 256
    width: 256
    steps: 6
    guidance_scale: 7.5
    expected_role: remaining_small_sd_candidate

  - id: bk-sdm-base-cat
    enabled: false
    disabled_reason: "Visual review: generated image is heavily corrupted and not usable as a cat image."
