id: bonsai-smoke-v1
purpose: test Bonsai Image 4B through the official Bonsai Image Demo path on public GitHub Actions
runner: ubuntu-latest

limits:
  width: 256
  height: 256
  images_per_prompt: 1
  prompts: 1
  timeout_minutes: 90
  artifact_retention_days: 7

prompt:
  id: cat-lineart
  text: simple black outline sleeping cat, white background, no text

candidate:
  id: bonsai-image-4b-binary-gemlite
  enabled: true
  backend: official-demo
  demo_repo: https://github.com/PrismML-Eng/Bonsai-Image-Demo.git
  demo_ref: main
  model: binary-gemlite
  role: cpu-smoke-experimental

policy:
  commit_outputs: false
  upload_artifact: true
  concurrency_group: bonsai-smoke-queue
  expected_failure_on_cpu_only: true
