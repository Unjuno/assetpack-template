experiment_id: image-model-ci-curated-chameleons-v1
prompt: "a cute chameleon perched on a bonsai branch in a bonsai pot, detailed scales, natural chameleon anatomy, curled tail, studio lighting, sharp focus"
negative_prompt: "blurry, distorted, deformed, extra limbs, melted face, low quality, abstract object, not a chameleon, cat, dog, rabbit, bird, toy"
seed: 12345
output_root: reports/image-model-ci-curated-chameleons
runtime:
